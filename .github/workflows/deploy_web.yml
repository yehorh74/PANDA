name: Build and Deploy Flet Web

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: panda-app
        run: |
          python -m pip install --upgrade pip
          python -m pip install flet -r requirements.txt

      - name: Build Flet Web
        working-directory: panda-app
        env:
          CI: "true"
          FLET_NON_INTERACTIVE: "true"
        run: |
          flet build web --build-number ${{ github.run_number }} \
            --base-url / \
            --web-renderer auto \
            -o dist/web

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy panda-app/build/web --project-panda-app --branch=main