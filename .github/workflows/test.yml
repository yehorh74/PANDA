name: Run Pytest Suite

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install System Dependencies (OpenGL & Xvfb)
      run: |
        sudo apt-get update
        sudo apt-get install -y freeglut3-dev libgtk-3-dev xvfb python3-opengl

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        # Instalacja paczki w trybie edytowalnym wraz z jej zależnościami
        pip install -e .

    - name: Run Tests with Xvfb (Headless Display)
      run: |
        xvfb-run --auto-servernum pytest --cov=panda --cov-report=xml

    - name: Upload Coverage to Codecov (Opcjonalnie)
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        fail_ci_if_error: false