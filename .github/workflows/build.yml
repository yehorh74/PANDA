name: Build PANDA Desktop App

on:
  push:       
  pull_request: 
    branches: [ "**" ]    

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: panda-app  
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller flet -r requirements.txt

      - name: Build executable with flet pack
        working-directory: panda-app
        run: |
          flet pack main.py --icon assets/Panda_icon.ico --product-name "PANDA" --product-version "0.0.5" --copyright "Copyright (c) 2026 Yehor Horin"

      - name: Upload built app as artifact
        uses: actions/upload-artifact@v4
        with:
          name: PANDA-Windows-Executable
          path: panda-app/dist/